services:
  neo4j:
    image: neo4j:2026.08.1
    container_name: yuzuu-neo4j
    restart: unless-stopped

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      # Credentials come from the local `.env` file (same variables the
      # knowledge:graph:sync CLI reads). A template lives in `.env.example`.
      # `:?` fails fast with a clear message when a variable is missing.
      NEO4J_AUTH: ${NEO4J_USERNAME:?NEO4J_USERNAME is required in .env}/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required in .env}

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
